[project]
name = "nlp-classification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mlflow>=2.0.0",
    "nltk>=3.9.2",
    "optuna>=4.7.0",
    "pandas>=2.0.0,<3",
    "pre-commit>=4.5.1",
    "scikit-learn>=1.8.0",
    "skops>=0.13.0",
]

[tool.uv.workspace]
members = ["api"]

[tool.coverage.run]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "model: no cover",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
prod = []

[tool.hatch.build.targets.wheel]
packages = ["modules"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
